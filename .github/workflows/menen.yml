name: Menen bedrijven bijwerken
on:
  schedule:
    - cron: "17 4 * * 1"   # elke maandag 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python extract_menen_full.py
      - name: Resultaat committen
        run: |
          git config user.name "menen-bot"
          git config user.email "menen-bot@users.noreply.github.com"
          git add data/menen_bedrijven.csv
          git diff --cached --quiet || git commit -m "Menen bedrijven bijgewerkt $(date -u +%F)"
          git push
